# Signed-in mode: the app saves to SQLite on the host through the document API.
# Needs CLERK_SECRET_KEY, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY and OPENFLOWKIT_CLERK_ORIGIN in the environment or a .env
# beside this file. Back up /srv/openflowkit-data (the database is one file plus its -wal/-shm while running).
services:
  web:
    build:
      context: .
      args:
        VITE_OPENFLOWKIT_API_URL: /api
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    ports: ["3045:3045"]
    environment:
      OPENFLOWKIT_API_UPSTREAM: http://api:8787
      OPENFLOWKIT_CLERK_ORIGIN: ${OPENFLOWKIT_CLERK_ORIGIN}
    depends_on: [api]
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:3045}
      OPENFLOWKIT_APP_URL: ${OPENFLOWKIT_APP_URL:-http://localhost:3045}
      OPENFLOWKIT_TRUST_PROXY: "1"
    volumes:
      - /srv/openflowkit-data:/data
